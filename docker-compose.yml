services:
  postgres:
    image: postgres:16-alpine
    container_name: juma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: juma
      POSTGRES_PASSWORD: juma_dev_password
      POSTGRES_DB: juma
      # Keeps local ordering/collation close to the Supabase default.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 5432 on the host is often taken (a WSL-hosted Postgres grabs loopback
      # via the WSL port relay), so the dev database is published on 55432.
      - "55432:5432"
    volumes:
      - juma-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juma -d juma"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  juma-pgdata:
